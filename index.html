<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KasKecil - Catatan Hutang & Piutang</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    .glass-header {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300 antialiased font-sans">

  <!-- Header / Navbar Section -->
  <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 glass-header transition-colors">
    <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
      
      <!-- Logo & Title -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-brand-600 flex items-center justify-center text-white shadow-lg shadow-brand-500/30">
          <i data-lucide="wallet" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-lg tracking-tight leading-none text-slate-900 dark:text-white">
            Kas<span class="text-brand-600 dark:text-brand-500">Kecil</span>
          </h1>
          <p class="text-[11px] font-medium text-slate-500 dark:text-slate-400 mt-0.5">Catatan Hutang & Piutang Simple</p>
        </div>
      </div>

      <!-- Action Controls (Theme Toggle) -->
      <div class="flex items-center gap-2">
        <button 
          id="themeToggleBtn"
          type="button"
          onclick="toggleTheme()" 
          class="flex items-center gap-2 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all cursor-pointer text-xs font-bold"
          title="Ubah Mode Tampilan"
        >
          <i id="themeIcon" data-lucide="moon" class="w-4 h-4 text-brand-600 dark:text-amber-400"></i>
          <span id="themeText" class="hidden sm:inline">Gelap</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl w-full mx-auto px-4 py-8 flex-1 flex flex-col gap-6">

    <!-- Dashboard Summary Grid (3 Cards) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      
      <!-- Card 1: Total Hutang -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm relative overflow-hidden transition-colors">
        <div class="flex justify-between items-start mb-2">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Total Hutang</span>
          <div class="w-8 h-8 rounded-xl bg-rose-500/10 text-rose-500 flex items-center justify-center">
            <i data-lucide="arrow-down-left" class="w-4 h-4"></i>
          </div>
        </div>
        <div id="summaryHutang" class="text-2xl font-extrabold text-rose-500">Rp 0</div>
        <p class="text-[11px] text-slate-400 mt-1">Uang yang harus dibayar</p>
      </div>

      <!-- Card 2: Total Piutang -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm relative overflow-hidden transition-colors">
        <div class="flex justify-between items-start mb-2">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Total Piutang</span>
          <div class="w-8 h-8 rounded-xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center">
            <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
          </div>
        </div>
        <div id="summaryPiutang" class="text-2xl font-extrabold text-emerald-500">Rp 0</div>
        <p class="text-[11px] text-slate-400 mt-1">Uang yang akan diterima</p>
      </div>

      <!-- Card 3: Saldo Bersih -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm relative overflow-hidden transition-colors">
        <div class="flex justify-between items-start mb-2">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Saldo Bersih</span>
          <div id="netIconContainer" class="w-8 h-8 rounded-xl bg-brand-500/10 text-brand-500 flex items-center justify-center">
            <i data-lucide="scale" class="w-4 h-4"></i>
          </div>
        </div>
        <div id="summaryNet" class="text-2xl font-extrabold text-brand-600 dark:text-brand-500">Rp 0</div>
        <p id="summaryNetLabel" class="text-[11px] text-slate-400 mt-1">Surplus Finansial</p>
      </div>

    </div>

    <!-- Form Input Transaksi -->
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm p-6 sm:p-8 transition-colors">
      <h2 class="text-sm font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-4 flex items-center gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4 text-brand-600"></i>
        Tambah Catatan Baru
      </h2>

      <form id="transactionForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        
        <!-- Segmented Control (Hutang vs Piutang) -->
        <div class="grid grid-cols-2 gap-2 p-1.5 bg-slate-100 dark:bg-slate-950 rounded-xl border border-slate-200 dark:border-slate-800">
          <button 
            type="button" 
            id="btnTypeHutang"
            onclick="setTransactionType('hutang')"
            class="py-2.5 rounded-lg text-xs font-extrabold transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer bg-rose-500 text-white shadow-md"
          >
            <i data-lucide="minus-circle" class="w-4 h-4"></i>
            HUTANG (Saya Pinjam)
          </button>
          <button 
            type="button" 
            id="btnTypePiutang"
            onclick="setTransactionType('piutang')"
            class="py-2.5 rounded-lg text-xs font-extrabold transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer text-slate-500 hover:text-slate-900 dark:hover:text-white"
          >
            <i data-lucide="plus-circle" class="w-4 h-4"></i>
            PIUTANG (Saya Piutangi)
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          
          <!-- Input Nama -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Nama Orang</label>
            <div class="relative">
              <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input 
                type="text" 
                id="inputName"
                required
                placeholder="Contoh: Budi Santoso"
                class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:border-brand-600 focus:ring-2 focus:ring-brand-500/20 rounded-xl pl-10 pr-4 py-2.5 text-sm font-medium outline-none transition-all text-slate-900 dark:text-white"
              />
            </div>
          </div>

          <!-- Input Nominal -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Nominal (Rp)</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-bold">Rp</span>
              <input 
                type="text" 
                id="inputAmount"
                oninput="handleAmountInput(this)"
                required
                placeholder="0"
                class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:border-brand-600 focus:ring-2 focus:ring-brand-500/20 rounded-xl pl-10 pr-4 py-2.5 text-sm font-medium outline-none transition-all text-slate-900 dark:text-white"
              />
            </div>
          </div>

          <!-- Input Jatuh Tempo -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Tanggal Jatuh Tempo</label>
            <div class="relative">
              <input 
                type="date" 
                id="inputDueDate"
                required
                class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:border-brand-600 focus:ring-2 focus:ring-brand-500/20 rounded-xl px-4 py-2 text-sm font-medium outline-none transition-all text-slate-900 dark:text-white cursor-pointer"
              />
            </div>
          </div>

        </div>

        <!-- Catatan Tambahan -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Catatan Tambahan (Opsional)</label>
          <textarea 
            id="inputNote"
            rows="2"
            placeholder="Contoh: Pinjam untuk modal Beli barang..."
            class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:border-brand-600 focus:ring-2 focus:ring-brand-500/20 rounded-xl p-3 text-sm font-medium outline-none transition-all text-slate-900 dark:text-white"
          ></textarea>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit"
          class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-300 transform hover:scale-[1.005] shadow-lg shadow-brand-500/20 flex items-center justify-center gap-2 cursor-pointer"
        >
          <i data-lucide="save" class="w-4 h-4"></i>
          <span>Simpan Catatan</span>
        </button>

      </form>
    </div>

    <!-- Filter Bar & Search -->
    <div class="flex flex-col md:flex-row items-center justify-between gap-4">
      
      <!-- Filter Tabs -->
      <div class="flex flex-wrap gap-1 bg-slate-200/60 dark:bg-slate-900 p-1 rounded-xl border border-slate-200 dark:border-slate-800 w-full md:w-auto">
        <button type="button" onclick="setFilterTab('semua')" id="tab-semua" class="tab-btn px-3 py-1.5 rounded-lg text-xs capitalize transition-all cursor-pointer font-bold bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 shadow-sm">Semua</button>
        <button type="button" onclick="setFilterTab('hutang')" id="tab-hutang" class="tab-btn px-3 py-1.5 rounded-lg text-xs capitalize transition-all cursor-pointer font-medium text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">Hutang</button>
        <button type="button" onclick="setFilterTab('piutang')" id="tab-piutang" class="tab-btn px-3 py-1.5 rounded-lg text-xs capitalize transition-all cursor-pointer font-medium text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">Piutang</button>
        <button type="button" onclick="setFilterTab('lunas')" id="tab-lunas" class="tab-btn px-3 py-1.5 rounded-lg text-xs capitalize transition-all cursor-pointer font-medium text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">Lunas</button>
      </div>

      <!-- Search Bar -->
      <div class="relative w-full md:w-64">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input 
          type="text" 
          id="searchInput"
          oninput="handleSearch(this.value)"
          placeholder="Cari nama / catatan..."
          class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl pl-9 pr-8 py-2 text-xs outline-none focus:border-brand-600 transition-all text-slate-900 dark:text-white"
        />
      </div>

    </div>

    <!-- Transaction List Container -->
    <div id="transactionList" class="space-y-3">
      <!-- Transaksi akan dirender di sini via JS -->
    </div>

  </main>

  <!-- Script Engine Vanilla JS -->
  <script>
    // State Management
    let transactions = [];
    let currentType = 'hutang';
    let currentFilterTab = 'semua';
    let searchQuery = '';
    let rawAmountValue = 0;

    // Initialization
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      loadData();
      setDefaultDueDate();
      render();
    });

    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        updateThemeUI(true);
      } else {
        document.documentElement.classList.remove('dark');
        updateThemeUI(false);
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeUI(isDark);
    }

    function updateThemeUI(isDark) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (isDark) {
        icon.setAttribute('data-lucide', 'sun');
        text.textContent = 'Terang';
      } else {
        icon.setAttribute('data-lucide', 'moon');
        text.textContent = 'Gelap';
      }
      lucide.createIcons();
    }

    // LocalStorage Operations
    function loadData() {
      const saved = localStorage.getItem('kaskecil_transactions');
      if (saved) {
        try {
          transactions = JSON.parse(saved);
        } catch (e) {
          transactions = [];
        }
      }
    }

    function saveData() {
      localStorage.setItem('kaskecil_transactions', JSON.stringify(transactions));
    }

    // Default Date Set (H+7)
    function setDefaultDueDate() {
      const defaultDue = new Date();
      defaultDue.setDate(defaultDue.getDate() + 7);
      document.getElementById('inputDueDate').value = defaultDue.toISOString().split('T')[0];
    }

    // Formatters
    function formatRupiah(number) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number || 0);
    }

    // Fixed Date Formatter (Anti-Timezone Shift)
    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const parts = dateStr.split('T')[0].split('-');
      if (parts.length === 3) {
        const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
        return dateObj.toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
      }
      return new Date(dateStr).toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    // Security Sanitization
    function sanitizeInput(str) {
      if (typeof str !== 'string') return '';
      return str.replace(/[$&<>'"]/g, function(m) {
        return {
          '$': '&#36;',
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#039;',
          '"': '&quot;'
        }[m];
      });
    }

    // Form Handlers
    function setTransactionType(type) {
      currentType = type;
      const btnHutang = document.getElementById('btnTypeHutang');
      const btnPiutang = document.getElementById('btnTypePiutang');

      if (type === 'hutang') {
        btnHutang.className = "py-2.5 rounded-lg text-xs font-extrabold transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer bg-rose-500 text-white shadow-md";
        btnPiutang.className = "py-2.5 rounded-lg text-xs font-extrabold transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer text-slate-500 hover:text-slate-900 dark:hover:text-white";
      } else {
        btnPiutang.className = "py-2.5 rounded-lg text-xs font-extrabold transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer bg-emerald-500 text-white shadow-md";
        btnHutang.className = "py-2.5 rounded-lg text-xs font-extrabold transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer text-slate-500 hover:text-slate-900 dark:hover:text-white";
      }
    }

    function handleAmountInput(input) {
      let raw = input.value.replace(/\D/g, '');
      rawAmountValue = raw ? parseInt(raw, 10) : 0;
      input.value = raw ? new Intl.NumberFormat('id-ID').format(rawAmountValue) : '';
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const nameInput = document.getElementById('inputName').value;
      const dueDateInput = document.getElementById('inputDueDate').value;
      const noteInput = document.getElementById('inputNote').value;

      if (!nameInput.trim() || rawAmountValue <= 0 || !dueDateInput) return;

      const newTransaction = {
        id: Date.now().toString(),
        name: sanitizeInput(nameInput.trim()),
        type: currentType,
        amount: rawAmountValue,
        dueDate: dueDateInput, // Menyimpan nilai YYYY-MM-DD persis
        note: sanitizeInput(noteInput.trim()),
        isPaid: false,
        createdAt: new Date().toISOString()
      };

      transactions.unshift(newTransaction);
      saveData();
      
      // Reset Form
      document.getElementById('inputName').value = '';
      document.getElementById('inputAmount').value = '';
      document.getElementById('inputNote').value = '';
      rawAmountValue = 0;
      setDefaultDueDate();

      render();
    }

    // Filter & Search Controls
    function setFilterTab(tab) {
      currentFilterTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = "tab-btn px-3 py-1.5 rounded-lg text-xs capitalize transition-all cursor-pointer font-medium text-slate-500 hover:text-slate-800 dark:hover:text-slate-200";
      });

      const activeBtn = document.getElementById(`tab-${tab}`);
      if (activeBtn) {
        activeBtn.className = "tab-btn px-3 py-1.5 rounded-lg text-xs capitalize transition-all cursor-pointer font-bold bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 shadow-sm";
      }

      renderTransactions();
    }

    function handleSearch(query) {
      searchQuery = query.toLowerCase().trim();
      renderTransactions();
    }

    // Summary Calculations
    function updateSummary() {
      let totalHutang = 0;
      let totalPiutang = 0;

      transactions.forEach(t => {
        if (!t.isPaid) {
          if (t.type === 'hutang') totalHutang += t.amount;
          if (t.type === 'piutang') totalPiutang += t.amount;
        }
      });

      const netBalance = totalPiutang - totalHutang;

      document.getElementById('summaryHutang').textContent = formatRupiah(totalHutang);
      document.getElementById('summaryPiutang').textContent = formatRupiah(totalPiutang);
      
      const netEl = document.getElementById('summaryNet');
      const netLabel = document.getElementById('summaryNetLabel');
      
      netEl.textContent = formatRupiah(netBalance);
      
      if (netBalance >= 0) {
        netEl.className = "text-2xl font-extrabold text-brand-600 dark:text-brand-500";
        netLabel.textContent = "Surplus Finansial";
      } else {
        netEl.className = "text-2xl font-extrabold text-rose-500";
        netLabel.textContent = "Defisit Finansial";
      }
    }

    // Overdue Check Function
    function isOverdue(dueDateStr, isPaid) {
      if (!dueDateStr || isPaid) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const parts = dueDateStr.split('-');
      const due = new Date(parts[0], parts[1] - 1, parts[2]);
      return due < today;
    }

    // Render Transactions List
    function renderTransactions() {
      const container = document.getElementById('transactionList');
      
      const filtered = transactions.filter(t => {
        if (currentFilterTab === 'hutang' && t.type !== 'hutang') return false;
        if (currentFilterTab === 'piutang' && t.type !== 'piutang') return false;
        if (currentFilterTab === 'lunas' && !t.isPaid) return false;

        if (searchQuery !== '') {
          const matchName = t.name.toLowerCase().includes(searchQuery);
          const matchNote = t.note ? t.note.toLowerCase().includes(searchQuery) : false;
          return matchName || matchNote;
        }

        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-12 text-center">
            <div class="w-12 h-12 bg-slate-100 dark:bg-slate-800 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-3">
              <i data-lucide="folder-open" class="w-6 h-6"></i>
            </div>
            <h3 class="font-bold text-slate-700 dark:text-slate-300 text-sm mb-1">Belum Ada Transaksi</h3>
            <p class="text-slate-400 text-xs">Tidak ada catatan transaksi yang sesuai dengan filter/pencarian Anda.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = filtered.map(item => {
        const overdue = isOverdue(item.dueDate, item.isPaid);
        return `
          <div class="bg-white dark:bg-slate-900 border ${overdue ? 'border-rose-500/50 dark:border-rose-500/50 ring-1 ring-rose-500/20' : 'border-slate-200 dark:border-slate-800'} ${item.isPaid ? 'opacity-60 bg-slate-50 dark:bg-slate-950/40' : ''} rounded-2xl p-4 sm:p-5 transition-all duration-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-sm">
            
            <div class="space-y-1">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full border ${item.type === 'hutang' ? 'bg-rose-500/10 text-rose-500 border-rose-500/20' : 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20'}">
                  ${item.type}
                </span>

                ${item.isPaid ? `
                  <span class="text-[10px] font-bold bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 px-2 py-0.5 rounded-full flex items-center gap-1">
                    <i data-lucide="check" class="w-3 h-3 text-emerald-500"></i> Lunas
                  </span>
                ` : ''}

                ${overdue ? `
                  <span class="text-[10px] font-bold bg-rose-500 text-white px-2 py-0.5 rounded-full flex items-center gap-1 animate-pulse">
                    <i data-lucide="clock" class="w-3 h-3"></i> Lewat Tenggat
                  </span>
                ` : ''}

                <span class="text-[11px] text-slate-400 font-medium">
                  Dibuat: ${formatDate(item.createdAt)}
                </span>
              </div>

              <h4 class="text-base font-extrabold text-slate-900 dark:text-white ${item.isPaid ? 'line-through text-slate-400 dark:text-slate-500' : ''}">
                ${item.name}
              </h4>

              ${item.note ? `<p class="text-xs text-slate-500 dark:text-slate-400">${item.note}</p>` : ''}

              <div class="text-[11px] font-semibold text-brand-600 dark:text-brand-400 flex items-center gap-1 mt-1">
                <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                <span>Jatuh Tempo: <strong>${formatDate(item.dueDate)}</strong></span>
              </div>
            </div>

            <div class="flex sm:flex-col items-center sm:items-end justify-between border-t sm:border-t-0 pt-3 sm:pt-0 border-slate-100 dark:border-slate-800 gap-3">
              <div class="text-lg font-black ${item.isPaid ? 'text-slate-400 line-through' : (item.type === 'hutang' ? 'text-rose-500' : 'text-emerald-500')}">
                ${formatRupiah(item.amount)}
              </div>

              <div class="flex items-center gap-2">
                <button 
                  type="button"
                  onclick="togglePaid('${item.id}')"
                  class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1 cursor-pointer ${item.isPaid ? 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300' : 'bg-emerald-500 hover:bg-emerald-600 text-white shadow-md shadow-emerald-500/20'}"
                >
                  <i data-lucide="${item.isPaid ? 'rotate-ccw' : 'check'}" class="w-3.5 h-3.5"></i>
                  <span>${item.isPaid ? 'Batal Lunas' : 'Tandai Lunas'}</span>
                </button>

                <button 
                  type="button"
                  onclick="deleteTransaction('${item.id}')"
                  class="p-1.5 rounded-xl text-slate-400 hover:text-rose-500 hover:bg-rose-500/10 transition-all cursor-pointer"
                  title="Hapus Catatan"
                >
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // Actions
    function togglePaid(id) {
      const index = transactions.findIndex(t => t.id === id);
      if (index !== -1) {
        const nextPaidState = !transactions[index].isPaid;
        transactions[index].isPaid = nextPaidState;
        saveData();

        // Trigger Confetti Effect jika menandai LUNAS
        if (nextPaidState && typeof confetti === 'function') {
          confetti({
            particleCount: 80,
            spread: 60,
            origin: { y: 0.7 }
          });
        }

        render();
      }
    }

    function deleteTransaction(id) {
      if (confirm('Apakah Anda yakin ingin menghapus catatan transaksi ini?')) {
        transactions = transactions.filter(t => t.id !== id);
        saveData();
        render();
      }
    }

    // Main Render Pipeline
    function render() {
      updateSummary();
      renderTransactions();
    }
  </script>
</body>
</html>
